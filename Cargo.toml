[package]
name = "avmesh"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Whole-instance snapshot replication for AliasVault over a tailnet (ADR 0001, option O3)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
